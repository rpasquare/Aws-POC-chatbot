services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: deal
      POSTGRES_PASSWORD: deal
      POSTGRES_DB: deal_workspace
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deal -d deal_workspace"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: deal-workspace:dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://deal:deal@db:5432/deal_workspace
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      S3_BUCKET: ${S3_BUCKET:-deal-workspace-dev}
      EXTRACTION_SERVICE_URL: ${EXTRACTION_SERVICE_URL:-http://host.docker.internal:8001}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    image: deal-workspace:dev
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://deal:deal@db:5432/deal_workspace
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      S3_BUCKET: ${S3_BUCKET:-deal-workspace-dev}
      EXTRACTION_SERVICE_URL: ${EXTRACTION_SERVICE_URL:-http://host.docker.internal:8001}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
